# Builds Axell 76 on Linux (Ubuntu 24.04) and Windows (MSVC), runs the test suites and pluginval on both, renders a
# fixed signal through the shipping engine on each and checks Linux and Windows sound the same. The Windows VST3 is
# kept as an artifact. Least privilege: read-only token, no secrets, actions pinned to exact commits.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Full analysis (the DSP suite always runs in full; this keeps every report)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System packages (Linux; the same list as scripts/setup-toolbox.sh)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config curl unzip xvfb \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Axell76_VST3 A76DspTests A76PluginTests a76_render -j4
          echo "BIN=build" >> "$GITHUB_ENV"; echo "EXE=" >> "$GITHUB_ENV"; echo "RUN=xvfb-run -a" >> "$GITHUB_ENV"
      - name: Configure and build (Windows, clang-cl)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL   # clang-cl: measured 6-13 % less CPU than MSVC
          cmake --build build --config Release --target Axell76_VST3 A76DspTests A76PluginTests a76_render -- -m
          echo "BIN=build/Release" >> "$GITHUB_ENV"; echo "EXE=.exe" >> "$GITHUB_ENV"; echo "RUN=" >> "$GITHUB_ENV"
      - name: DSP suite
        run: |
          mkdir -p reports
          ./$BIN/A76DspTests$EXE 2>&1 | tee reports/dsp-$RUNNER_OS.txt
      - name: Plugin suite
        run: |
          T=$(find build -type f -name "A76PluginTests$EXE" -path "*Release*" | head -1); echo "found: $T"
          [ -n "$T" ] || { find build -maxdepth 4 -name "*PluginTests*"; exit 1; }
          $RUN "$T" 2>&1 | tee reports/plugin-$RUNNER_OS.txt
      - name: Windows crash details (only when a suite failed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include *DspTests.exe,*PluginTests.exe | Where-Object FullName -match 'Release' | ForEach-Object {
            Write-Host "== $($_.FullName)"
            $a = @(); if ($_.Name -match 'DspTests') { $a = '' -split ' ' | Where-Object { $_ } }
            & $_.FullName @a 2>&1 | Select-Object -Last 25
            Write-Host ("exit code 0x{0:X8}" -f $LASTEXITCODE)
          }
      - name: pluginval (strictness 10)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then Z=pluginval_Windows.zip; S=.github/pluginval-windows.sha256; else Z=pluginval_Linux.zip; S=.github/pluginval.sha256; fi
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$Z"
          echo "$(cat $S)  pluginval.zip" | sha256sum -c
          unzip -o pluginval.zip
          $RUN ./pluginval$EXE --strictness-level 10 --validate-in-process \
            --validate "build/Axell76_artefacts/Release/VST3/Axell 76.vst3" 2>&1 | tee reports/pluginval-$RUNNER_OS.txt
      - name: Render the match signal through the shipping engine
        run: |
          mkdir -p match
          python3 tools/xplat.py gen match/in.f32 || python tools/xplat.py gen match/in.f32
          ./$BIN/a76_render$EXE match/in.f32 match/default.f32 48000 2
          ./$BIN/a76_render$EXE match/in.f32 match/hard.f32 48000 2 input=30 ratio=4 attack=7 release=7
          ./$BIN/a76_render$EXE match/in.f32 match/parallel.f32 48000 2 input=24 ratio=1 mix=50 os=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-${{ runner.os }}
          path: reports/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: match-${{ runner.os }}
          path: match/*.f32
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: Axell76-windows-vst3
          path: build/Axell76_artefacts/Release/VST3/
          retention-days: 30
  linux-windows-match:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: match-*
      - name: Linux and Windows renders match
        run: for f in default hard parallel; do python3 tools/xplat.py compare match-Linux/$f.f32 match-Windows/$f.f32 -90; done
